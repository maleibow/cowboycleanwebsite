<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cowboy Clean: Ultimate World Tour 3D</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bangers&display=swap");

      /* --- 16:9 SCALER (same approach as cleaningup.html) --- */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #000; overflow: hidden; color: white;
        font-family: "Bangers", cursive;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #game-wrapper {
        width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center; background: #000;
      }
      #game-scale-box {
        position: relative;
        max-height: 100%;
        width: min(100%, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000; overflow: hidden;
        box-shadow: 0 0 50px rgba(0, 0, 0, 1);
      }
      canvas { display: block; width: 100%; height: 100%; background: #000; }
      #hud { position: absolute; inset: 0; pointer-events: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./game3d/vendor/three.module.min.js",
          "three/addons/": "./game3d/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game-scale-box">
        <canvas id="game"></canvas>
        <div id="hud"></div>
      </div>
    </div>
    <script type="module" src="./game3d/main.js"></script>
  </body>
</html>
