    <style>
      /* --- 16:9 SCALER (same approach as cleaningup.html) --- */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #000; overflow: hidden; color: white;
        font-family: "Bangers", cursive;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
      }
      #game-wrapper {
        width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center; background: #000;
      }
      #game-scale-box {
        position: relative;
        max-height: 100%;
        width: min(100%, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000; overflow: hidden;
        box-shadow: 0 0 50px rgba(0, 0, 0, 1);
      }
      @supports (height: 100dvh) {          /* mobile browsers: 100vh includes the hidden address bar, 100dvh is what is really visible */
        html, body, #game-wrapper { height: 100dvh; }
        #game-scale-box { width: min(100%, calc(100dvh * 16 / 9)); }
      }
      /* pseudo fullscreen (original .pseudo-fs): where the Fullscreen API is blocked or missing, fill the visible screen */
      body.pseudo-fs #game-wrapper { position: fixed; inset: 0; z-index: 30; }
      /* touch layout: fullscreen / mute sit top right (the 16:9 box leaves that corner free), power-up chips step down under them */
      body.touch-ui #mute-btn { right: 12px !important; left: auto !important; bottom: auto !important; top: 8px !important; }
      body.touch-ui #fs-btn { left: auto !important; right: 64px !important; bottom: auto !important; top: 8px !important; }
      body.touch-ui #hud-chips { top: 116px !important; }
      canvas { display: block; width: 100%; height: 100%; }   /* transparent until the first frame, so the splash / dusk gradient shows through */
      #game-scale-box { background: linear-gradient(#1b0d33 0%, #5b2a58 45%, #d9703a 100%); }
      /* first-paint splash: plain HTML + CSS, painted before any script runs; main.js removes it once the title menu is up */
      #splash { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; background: linear-gradient(#1b0d33 0%, #5b2a58 45%, #d9703a 100%); transition: opacity .35s; }
      #splash .t1 { font-size: clamp(40px, 11vmin, 120px); line-height: .92; color: #ffd84a; text-shadow: 5px 5px 0 #000, 0 0 30px rgba(255,150,50,.6); -webkit-text-stroke: 2px #8a4a10; letter-spacing: 2px; }
      #splash .t2 { font-size: clamp(18px, 4vmin, 40px); color: #fff; text-shadow: 3px 3px 0 #000; letter-spacing: 3px; }
      #splash .bar { width: min(260px, 50%); height: 10px; margin-top: 20px; border: 2px solid #fff; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.45); }
      #splash .bar i { display: block; height: 100%; width: 40%; background: #ffd84a; animation: cc-load 1.1s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
      @keyframes cc-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      #hud, #ui { position: absolute; inset: 0; pointer-events: none; }
      #ui button, #ui input, #ui a { pointer-events: auto; }
    </style>
